appId: com.kdna.quicklaunch
productName: KDNA QuickLaunch
directories:
  buildResources: assets
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
win:
  target: nsis
  icon: assets/icons/icon.ico
mac:
  target: dmg
  icon: assets/icons/icon.icns
linux:
  target:
    - AppImage
    - deb
  icon: assets/icons/icon.png
